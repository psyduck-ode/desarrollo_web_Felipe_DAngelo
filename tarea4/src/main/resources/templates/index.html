<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Patitas en Busca de un Hogar</title>
    <link rel="stylesheet" th:href="@{/css/styleList.css}">
</head>
<body>
    <h1>Bienvenidos a Patitas en Busca de un Hogar</h1>
    
    <div th:if="${mensaje}" style="background-color: #ddffdd; border-left: 5px solid #4CAF50; padding: 10px; margin: 20px 0;">
        <p th:text="${mensaje}"></p>
    </div>
    
    <!-- Botones del menu -->
    <div>
        <button type="button" id="btn-agregar-aviso-adopción" th:onclick="|window.location.href='@{/agregar}'|">Agregar aviso de adopción</button>
        <button type="button" id="btn-ver-listado-de-adopciones" th:onclick="|window.location.href='@{/listado}'|">Ver listado de adopciones</button>
        <button type="button" id="btn-estadisticas" th:onclick="|window.location.href='@{/estadisticas}'|">Estadísticas</button>
        <button type="button" id="btn-evaluaciones" th:onclick="|window.location.href='@{/evaluaciones}'|">Evaluaciones</button>
    </div>
    
    <!-- Tabla con últimos 5 avisos -->
    <div>
        <table>
            <thead>
                <tr>
                    <th>Fecha de publicación</th>
                    <th>Comuna</th>
                    <th>Sector</th>
                    <th>Cantidad Tipo Edad</th>
                    <th>Foto</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aviso : ${avisos}">
                    <td>
                        <span th:text="${#temporals.format(aviso.fechaIngreso, 'yyyy-MM-dd')}"></span><br>
                        <span th:text="${#temporals.format(aviso.fechaIngreso, 'HH:mm')}"></span>
                    </td>
                    <td th:text="${aviso.comuna.nombre}"></td>
                    <td th:text="${aviso.sector != null ? aviso.sector : '-'}"></td>
                    <td>
                        <span th:text="${aviso.cantidad}"></span>
                        <span th:text="${aviso.tipo.name() == 'gato' ? 'Gato' : 'Perro'}"></span>
                        <span th:text="${aviso.cantidad > 1 ? 's' : ''}"></span><br>
                        <span th:text="${aviso.edad}"></span>
                        <span th:text="${aviso.unidadMedida.name()}"></span>
                    </td>
                    <td>
                        <img th:if="${!aviso.fotos.isEmpty()}" 
                             th:src="@{'/uploads/' + ${aviso.fotos[0].nombreArchivo}}" 
                             width="320" height="240" alt="Foto mascota">
                        <span th:if="${aviso.fotos.isEmpty()}">Sin foto</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(avisos)}">
                    <td colspan="5">No hay avisos de adopción aún</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
