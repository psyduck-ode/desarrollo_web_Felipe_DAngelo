<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Adopción</title>
    <link rel="stylesheet" th:href="@{/css/styleForm.css}">
</head>
<body>
    <div class="main-container">
        <!-- Mostrar errores si existen -->
        <div th:if="${errores != null && !errores.isEmpty()}" id="val-box" 
             style="background-color: #ffdddd; border-left: 5px solid #f44336; padding: 10px; margin: 20px 0;">
            <h2>Los siguientes campos son inválidos:</h2>
            <ul>
                <li th:each="error : ${errores.values()}" th:text="${error}"></li>
            </ul>
        </div>
        
        <div th:unless="${errores != null && !errores.isEmpty()}" id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
        
        <form name="myForm" method="post" th:action="@{/agregar}" enctype="multipart/form-data">
            <td>¿Donde?</td><br>
            
            <label for="select-region">Región</label>
            <select name="select-region" id="select-region" required>
                <option value="">Seleccione una región</option>
            </select><br>

            <label for="select-comuna">Comuna</label>
            <select name="select-comuna" id="select-comuna" required>
                <option value="">Seleccione una comuna</option>
            </select><br>

            <label for="input-sector">Sector</label>
            <input type="text" name="input-sector" id="input-sector" maxlength="100"><br>
        
            <td>¿Contacto de esta publicación?</td><br>

            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" minlength="3" maxlength="200" required><br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" maxlength="100" required><br>

            <label for="numTel">Número de teléfono</label>
            <input type="tel" name="numTel" id="numTel" required placeholder="+56912345678"><br>

            <label for="select-contactarPor">Contactar por</label><br>

            <input type="checkbox" name="whatsapp" onclick="revisaCheck(this);"> whatsapp
            <input id="whatsapp" type="text" name="contacto-whatsapp" style="display:none;" minlength="4" maxlength="50"><br>

            <input type="checkbox" name="telegram" onclick="revisaCheck(this);"> telegram
            <input id="telegram" type="text" name="contacto-telegram" style="display:none;" minlength="4" maxlength="50"><br>

            <input type="checkbox" name="x" onclick="revisaCheck(this);"> X
            <input id="x" type="text" name="contacto-x" style="display:none;" minlength="4" maxlength="50"><br>

            <input type="checkbox" name="instagram" onclick="revisaCheck(this);"> instagram
            <input id="instagram" type="text" name="contacto-instagram" style="display:none;" minlength="4" maxlength="50"><br>

            <input type="checkbox" name="tiktok" onclick="revisaCheck(this);"> tiktok
            <input id="tiktok" type="text" name="contacto-tiktok" style="display:none;" minlength="4" maxlength="50"><br>

            <input type="checkbox" name="otra" onclick="revisaCheck(this);"> otra
            <input id="otra" type="text" name="contacto-otra" style="display:none;" minlength="4" maxlength="50"><br>

            <td>¿Qué mascota ofrece en adopción?</td><br>
            
            <label for="select-tipo">Tipo</label>
            <select name="select-tipo" id="select-tipo" required>
                <option value="">Seleccione un tipo</option>
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
            </select><br>
                
            <label for="input-cantidad">Cantidad</label>
            <input type="number" name="input-cantidad" id="input-cantidad" min="1" required><br>

            <label for="input-edad">Edad</label>
            <input type="number" name="input-edad" id="input-edad" min="1" required><br>

            <label for="select-medidaEdad">Medida de edad</label>
            <select name="select-medidaEdad" id="select-medidaEdad" required>
                <option value="">Seleccione una medida</option>
                <option value="m">Meses</option>
                <option value="a">Años</option>
            </select><br>

            <label for="fecha-disponible-entrega">Fecha disponible para la entrega</label>
            <input type="datetime-local" id="fecha-disponible-entrega" name="fecha-disponible-entrega" required><br>

            <label for="input-descripcion">Descripción</label>
            <textarea name="input-descripcion" id="input-descripcion" rows="10" cols="50"></textarea><br>

            <label for="input-foto">Foto</label>
            <input type="file" name="input-foto" id="input-foto" accept="image/*" required><br>
            <button type="button" id="btn-agregar-foto" name="otra-foto" onclick="agregarFoto()">agregar otra foto</button>
            
            <div id="mas-fotos"></div>
            <br>

            <button type="button" id="btn-enviar">Agregar este aviso de adopción</button>
            <div id="confirmar" class="modal" style="display: none;">
                <div class="modal-box">
                    <p>¿Está seguro que desea agregar esta actividad?</p>
                    <button type="submit" id="btn-si">Sí, estoy seguro</button>
                    <button type="button" id="btn-no">No, no estoy seguro, quiero volver al formulario.</button>
                </div>
            </div>
        </form>
    </div>
    
    <button type="button" id="btn-volver-inicio" th:onclick="|window.location.href='@{/}'|">Volver al inicio</button>
    
    <script th:src="@{/js/select.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/revisaCheck.js}"></script>
    <script th:src="@{/js/fechaHora.js}"></script>
    <script th:src="@{/js/agregarFoto.js}"></script>
</body>
</html>
